syntax = "proto3";

package aapis.orchestrator.v2;

message DefineJobRequest {
    // Unique identifier for this type of job
    string job_type = 1;
    // String defining the job logic
    string job_definition = 2;
}

message DefineJobResponse {
    // Whether the job definition could be added
    bool success = 1;
    // Error message, if applicable
    string message = 2;
}

message KickoffJobRequest {
    // Priority level of the job (0 = highest)
    int64 priority = 1;
    // Jobs that must complete before this one can begin
    // Dependencies can also be inferred by the jobs themselves instead
    repeated int64 blocking_job_ids = 2;
    // The job type to kick off
    string job_type = 3;
    // List of input job IDs to pass to the job
    repeated int64 input_job_ids = 4;
    // List of input strings to pass to the job
    repeated string input_args = 5;
}

message KickoffJobResponse {
    // Whether the job could be kicked off
    bool success = 1;
    // Error message, if applicable
    string message = 2;
    // Unique ID (per session) for the job (returns -1 if error)
    int64 job_id = 3;
}

enum JobStatus {
    JOB_STATUS_UNSPECIFIED = 0;
    JOB_STATUS_INVALID = 1;
    JOB_STATUS_COMPLETE = 2;
    JOB_STATUS_QUEUED = 3;
    JOB_STATUS_ACTIVE = 4;
    JOB_STATUS_ERROR = 5;
    JOB_STATUS_BLOCKED = 6;
    JOB_STATUS_PAUSED = 7;
    JOB_STATUS_CANCELED = 8;
}

message JobStatusRequest {
    // Job to get the status of
    int64 job_id = 1;
}

message JobStatusResponse {
    // Status of the requested job
    JobStatus status = 1;
    // Execution command
    string exec = 2;
    // Priority level
    int64 priority = 3;
    // Current blocking jobs, if any
    repeated int64 blockers = 4;
    // Output paths from the job, if completed
    repeated string outputs = 5;
    // Child processes spawned from the Job's output
    repeated int64 spawned_children = 6;
    // Status message
    string message = 7;
    // Program output, if completed
    string program_output = 8;
    // Execution time in seconds
    double exec_duration_secs = 9;
}

message JobsSummaryStatusRequest {}

message JobsSummaryStatusResponse {
    // Number of jobs that have been completed
    int64 num_completed_jobs = 1;
    // List of job ids that have been completed
    repeated int64 completed_jobs = 2;
    // Number of jobs currently queued
    int64 num_queued_jobs = 3;
    // List of job ids that are queued
    repeated int64 queued_jobs = 4;
    // Number of jobs currently active
    int64 num_active_jobs = 5;
    // List of job ids that are active
    repeated int64 active_jobs = 6;
    // Number of jobs currently blocked
    int64 num_blocked_jobs = 7;
    // List of job ids that are blocked
    repeated int64 blocked_jobs = 8;
    // Number of jobs currently paused
    int64 num_paused_jobs = 9;
    // List of job ids that are paused
    repeated int64 paused_jobs = 10;
    // Number of jobs discarded
    int64 num_discarded_jobs = 11;
    // List of job ids that are discarded
    repeated int64 discarded_jobs = 12;
}

message PauseJobsRequest {}

message PauseJobsResponse {
    bool success = 1;
    string message = 2;
}

message ResumeJobsRequest {}

message ResumeJobsResponse {
    bool success = 1;
    string message = 2;
}

message CancelJobRequest {
    int64 job_id = 1;
}

message CancelJobResponse {
    bool success = 1;
    string message = 2;
}

message ListJobDefinitionsRequest {}

message JobDefinitionInfo {
    string job_type = 1;
    string job_definition = 2;
    int64 timeout_seconds = 3;
    int64 created_at = 4;  // Unix timestamp in seconds
    int64 updated_at = 5;  // Unix timestamp in seconds
}

message ListJobDefinitionsResponse {
    repeated JobDefinitionInfo definitions = 1;
}

message DeleteJobDefinitionRequest {
    string job_type = 1;
}

message DeleteJobDefinitionResponse {
    bool success = 1;
    string message = 2;
}

message QueryJobsRequest {
    // Filter by job type (empty = all types)
    string job_type_filter = 1;

    // Filter by status
    enum StatusFilter {
        ALL = 0;
        COMPLETE = 1;
        INCOMPLETE = 2;  // QUEUED, ACTIVE, BLOCKED, PAUSED
        ERROR = 3;
        CANCELED = 4;
    }
    StatusFilter status_filter = 2;

    // Sort order
    enum SortBy {
        JOB_ID = 0;          // Chronological by creation
        COMPLETION_TIME = 1;  // Completed jobs first, sorted by completion time
        PRIORITY = 2;         // By priority level
    }
    SortBy sort_by = 3;

    // Pagination
    int32 limit = 4;   // 0 = no limit
    int32 offset = 5;  // Skip first N results
}

message JobInfo {
    int64 job_id = 1;
    string job_type = 2;
    JobStatus status = 3;
    int64 priority = 4;
    int64 submitted_at = 5;     // Unix timestamp
    int64 completed_at = 6;     // Unix timestamp (0 if not complete)
    double exec_duration_secs = 7;
}

message QueryJobsResponse {
    repeated JobInfo jobs = 1;
    int32 total_count = 2;  // Total matching jobs (before pagination)
}

service OrchestratorService {
    rpc DefineJob (DefineJobRequest) returns (DefineJobResponse) {}
    rpc KickoffJob (KickoffJobRequest) returns (KickoffJobResponse) {}
    rpc JobStatus (JobStatusRequest) returns (JobStatusResponse) {}
    rpc JobsSummaryStatus (JobsSummaryStatusRequest) returns (JobsSummaryStatusResponse) {}
    rpc PauseJobs (PauseJobsRequest) returns (PauseJobsResponse) {}
    rpc ResumeJobs (ResumeJobsRequest) returns (ResumeJobsResponse) {}
    rpc CancelJob (CancelJobRequest) returns (CancelJobResponse) {}
    rpc ListJobDefinitions (ListJobDefinitionsRequest) returns (ListJobDefinitionsResponse) {}
    rpc DeleteJobDefinition (DeleteJobDefinitionRequest) returns (DeleteJobDefinitionResponse) {}
    rpc QueryJobs (QueryJobsRequest) returns (QueryJobsResponse) {}
}
